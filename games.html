<body>

  <header>
    <h1>Studio Clipd ホームページ</h1>

  <nav>

      <li><a href="index.html">ホーム</a></li>

      <li><a href="memo.html">覚書</a></li>
      <li><a href="games.html" class="active">実行できるゲーム</a></li>
    </ul>

  <main>
    <section class="card">
      <h2>実行できるゲーム</h2>
      <p>以下のリンクから、ブラウザ上で直接プレイできる作品を起動できます。</p>
    </section>

    <!-- ゲーム一覧 -->
    <div class="game-grid">

      <!-- ゲームカード 1 -->
      <article class="game-card">
        <div class="game-icon-container">
          <img src="Games/TestGame/icon.svg" alt="ゲームタイトル A アイコン" class="game-icon" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\'game-icon-placeholder\'>🎮</div>';">
        </div>
        
        <div class="game-info">
          <h3>Test Game</h3>
          <p>web gameのテストを行います。</p>
        </div>
        <a href="Games/TestGame/index.html" class="btn" target="_blank" rel="noopener">ゲームを起動する</a>
      </article>

      <!-- ゲームカード 2 -->
      <article class="game-card">
        <div class="game-icon-container">
          <img src="＃" alt="ゲームタイトル B アイコン" class="game-icon" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\'game-icon-placeholder\'>🎮</div>';">
        </div>
        
        <div class="game-info">
          <h3>ゲームタイトル B</h3>
          <p>ゲームの概要や操作方法などのちょっとしたメモを記述できます。</p>
        </div>
        <a href="Games/GameB/index.htm" class="btn" target="_blank" rel="noopener">ゲームを起動する</a>
      </article>

    </div>
